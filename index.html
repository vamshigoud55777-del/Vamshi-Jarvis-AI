<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAMSHI JARVIS AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#020713;color:#dff8ff;
 font-family:Arial,sans-serif;overflow-x:hidden;
 background:radial-gradient(ellipse at center,#08264b 0%,#020713 70%);
}
.app{text-align:center;padding:25px 15px;max-width:600px;margin:auto}
h1{color:#48dfff;letter-spacing:5px;text-shadow:0 0 20px #00aaff}
.sub{color:#80cfff;letter-spacing:3px}
.hologram{
 width:220px;height:220px;margin:35px auto;
 border-radius:50%;border:2px solid #16cfff;
 box-shadow:0 0 25px #00aaff,inset 0 0 35px #007bff;
 display:flex;align-items:center;justify-content:center;
 animation:pulse 3s infinite;
}
.face{font-size:115px;filter:drop-shadow(0 0 18px #00bfff)}
@keyframes pulse{
 50%{box-shadow:0 0 55px #00aaff,inset 0 0 55px #007bff}
}
.status{color:#00ffae;margin:20px}
.panel{
 border:1px solid #168dce;border-radius:18px;padding:20px;
 background:#04152dcc;box-shadow:0 0 18px #0066aa;
 margin:20px 0;
}
#reply{font-size:19px;line-height:1.6;min-height:55px}
input{
 width:75%;padding:14px;border-radius:25px;
 border:1px solid #00aaff;background:#06182a;color:white;
}
button{
 padding:14px 22px;border:1px solid #00cfff;
 border-radius:30px;background:#06345a;color:white;
 font-size:16px;margin:8px;cursor:pointer;
 box-shadow:0 0 12px #008cff;
}
button:active{background:#087ab9}
.mic{width:90px;height:90px;border-radius:50%;font-size:35px}
.small{color:#82b9d9;font-size:13px}
</style>
</head>

<body>
<div class="app">

<h1>VAMSHI JARVIS</h1>
<div class="sub">PERSONAL AI ASSISTANT</div>

<div class="hologram">
 <div class="face">👩🏻‍💻</div>
</div>

<div class="status" id="status">● SYSTEM ONLINE</div>

<div class="panel">
 <h3>FRIDAY AI</h3>
 <div id="reply">Hello Vamshi! ❤️<br>I am Jarvis. How can I help you?</div>
</div>

<div class="panel">
 <p>Speak to Jarvis</p>
 <button class="mic" onclick="listen()">🎙️</button>
 <p class="small">Tap microphone and speak</p>
 <input id="command" placeholder="Type your command...">
 <button onclick="send()">SEND</button>
</div>

<div class="panel">
 <h3>MY SYSTEM</h3>
 <p>Trading | Finance | Voice | AI</p>
 <p class="small">VAMSHI JARVIS VERSION 2.0</p>
</div>

</div>

<script>
const reply = document.getElementById("reply");
const status = document.getElementById("status");
const command = document.getElementById("command");

let recognition = null;

function isTelugu(text){
 return /[\u0C00-\u0C7F]/.test(text);
}

function speak(text){
 speechSynthesis.cancel();

 const msg = new SpeechSynthesisUtterance(text);

 // Telugu text gets Telugu voice; English gets Indian English voice.
 msg.lang = isTelugu(text) ? "te-IN" : "en-IN";
 msg.rate = 0.95;
 msg.pitch = 1;

 const voices = speechSynthesis.getVoices();

 let voice;

 if(isTelugu(text)){
   voice = voices.find(v => v.lang.toLowerCase().startsWith("te"));
 }else{
   voice = voices.find(v => v.lang.toLowerCase() === "en-in")
        || voices.find(v => v.lang.toLowerCase().startsWith("en"));
 }

 if(voice) msg.voice = voice;

 msg.onstart = () => status.innerText = "● JARVIS SPEAKING...";
 msg.onend = () => status.innerText = "● SYSTEM ONLINE";
 msg.onerror = () => status.innerText = "● SYSTEM ONLINE";

 speechSynthesis.speak(msg);
}

function answer(text){
 const q = text.toLowerCase().trim();

 let response =
 "Vamshi, I am listening. Please tell me what you need.";

 if(q.includes("hello") || q.includes("హలో") || q.includes("హాయ్")){
   response = "Hello Vamshi! I am Jarvis. How are you?";
 }
 else if(q.includes("నీ పేరు") || q.includes("your name")){
   response = "My name is Jarvis. I am your personal AI assistant.";
 }
 else if(q.includes("ఎలా ఉన్నావు") || q.includes("how are you")){
   response = "I am doing great, Vamshi. I am always ready to help you.";
 }
 else if(q.includes("time") || q.includes("సమయం")){
   response = "The time is " + new Date().toLocaleTimeString("en-IN");
 }
 else if(q.includes("date") || q.includes("తేదీ")){
   response = "Today is " + new Date().toLocaleDateString("en-IN");
 }
 else if(q.includes("trading") || q.includes("ట్రేడింగ్")){
   response = "Vamshi, I am ready to help you with trading information.";
 }
 else if(q.includes("ధన్యవాదాలు") || q.includes("thank")){
   response = "You are welcome Vamshi. Happy to help you.";
 }
 else if(q.includes("నీకు అర్థమైందా") || q.includes("do you understand")){
   response = "Yes Vamshi, I can understand your command.";
 }
 else if(q.includes("good morning")){
   response = "Good morning Vamshi! Have a wonderful day.";
 }
 else if(q.includes("good night")){
   response = "Good night Vamshi. Take care.";
 }

 reply.innerText = response;
 speak(response);
}

function send(){
 const value = command.value.trim();

 if(!value) return;

 answer(value);
 command.value = "";
}

function listen(){
 const Recognition =
   window.SpeechRecognition || window.webkitSpeechRecognition;

 if(!Recognition){
   reply.innerText =
     "Speech recognition is not supported in this browser. Please try Chrome.";
   return;
 }

 if(recognition){
   try{ recognition.abort(); }catch(e){}
 }

 recognition = new Recognition();

 // Telugu speech recognition. Change to en-IN for English-only commands.
 recognition.lang = "te-IN";
 recognition.continuous = false;
 recognition.interimResults = false;
 recognition.maxAlternatives = 1;

 status.innerText = "● LISTENING...";
 reply.innerText = "Listening Vamshi...";

 recognition.onresult = function(event){
   const text = event.results[0][0].transcript;

   command.value = text;
   answer(text);
 };

 recognition.onerror = function(event){
   status.innerText = "● SYSTEM ONLINE";

   if(event.error === "not-allowed"){
     reply.innerText = "Microphone permission denied. Please allow microphone access.";
   }else{
     reply.innerText = "Sorry Vamshi, I could not hear you. Please try again.";
   }
 };

 recognition.onend = function(){
   if(!speechSynthesis.speaking){
     status.innerText = "● SYSTEM ONLINE";
   }
 };

 try{
   recognition.start();
 }catch(error){
   status.innerText = "● SYSTEM ONLINE";
   reply.innerText = "Please tap the microphone again.";
 }
}

command.addEventListener("keydown", function(e){
 if(e.key === "Enter") send();
});

speechSynthesis.onvoiceschanged = function(){};

</script>
</body>
</html>
